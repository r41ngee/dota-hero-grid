[package]
name = "dotagrid-cli"
description = "Data types and recursive layout for Dota 2 hero grid configurations"
version = "0.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/r41ngee/dota-hero-grid"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dota-hero-grid = { version = "0.1.4", path = "../dota-hero-grid" }
image = { version = "0.25.9", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
rdotaconstants = { version = "0.2.6", optional = true }
unbundle = { version = "5.2.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["parse"] }

[features]
dev = ["dep:rdotaconstants", "dep:unbundle"]
