on:
  workflow_dispatch:

jobs:
  build-test:
    uses: "./.github/workflows/ci.yml"

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        crate: ["dota-hero-grid", "dotagrid-cli"]
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Detect changed crates
        id: changed
        run: |
          git fetch origin main

          changed=$(git diff --name-only origin/main HEAD)

          echo "${{ matrix.crate }}=false" >> "$GITHUB_OUTPUT"

          if grep -q '^crates/dota-hero-grid/' <<< "$changed"; then
            echo "dota-hero-grid=true" >> "$GITHUB_OUTPUT"
          else
            echo "dota-hero-grid=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.changed.outputs[matrix.crate] == 'true'
        run: cargo publish --package ${{matrix.crate}}