name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Get version
        id: version
        shell: bash
        run: |
          echo "version=$(cargo pkgid | sed 's/.*#//')" >> "$GITHUB_OUTPUT"

      - name: Install FFmpeg
        uses: AnimMouse/setup-ffmpeg@v1

      - name: Build
        run: cargo build --release --all-features --package dotagrid-cli

      - name: Create archive
        shell: bash
        run: |
          mkdir release
          cp target/release/dotagrid-cli release/

          if command -v ffmpeg >/dev/null; then
            cp "$(command -v ffmpeg)" release/
          fi

          ARCHIVE="dotagrid-cli-${{ steps.version.outputs.version }}-${{ matrix.os }}.tar.gz"
          tar -czf "$ARCHIVE" release

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}-${{ steps.version.outputs.version }}
          path: dotagrid-cli-${{ steps.version.outputs.version }}-${{ matrix.os }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: false

      - name: Show downloaded files
        run: find artifacts -type f

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/**/*