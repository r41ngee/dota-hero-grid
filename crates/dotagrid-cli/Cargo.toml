[package]
name = "dotagrid-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/r41ngee/dota-hero-grid"

include = [
    "examples/"
]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.4", features = ["derive"] }
dota-hero-grid = { version = "0.1.1", path = "../dota-hero-grid" }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.4", features = ["parse"] }
