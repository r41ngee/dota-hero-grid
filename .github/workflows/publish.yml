on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate to publish"
        required: true
        type: choice
        options:
          - '["dota-hero-grid"]'
          - '["dotagrid-cli"]'
          - '["dotagrid-cli", "dota-hero-grid"]'


jobs:
  build-test:
    uses: "./.github/workflows/ci.yml"

  publish:
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate: ${{fromJSON(github.event.inputs.crate)}}
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish --package ${{matrix.crate}}