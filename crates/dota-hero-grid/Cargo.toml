[package]
name = "dota-hero-grid"
description = "Data types and recursive layout for Dota 2 hero grid configurations"
license = "MIT"
version = "0.1.3"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/r41ngee/dota-hero-grid"

[features]
geometry = []

[dependencies]
derive-getters = "0.5.0"
getset = "0.1.7"
rdotaconstants = "0.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"


[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
