on:
    push:
        branches:
            [main]
    pull_request:
        branches:
            [main]

jobs:
    test:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v7
            - uses: dtolnay/rust-toolchain@stable

            - name: Build
              run: cargo build --verbose --all-features
            
            - name: Test
              run: cargo test --verbose --all-features
